<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kontak - SHES Strap</title>
  <style>
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #fff5f7; 
      color: #333; 
      padding: 20px; 
      margin: 0; 
    }
    .card { 
      background: white; 
      padding: 25px; 
      border-radius: 15px; 
      border: 1px solid #ffccd5; 
      max-width: 650px; 
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
    }
    h2 { 
      color: #c94c62; 
      margin-top: 0; 
      margin-bottom: 15px; 
      font-size: 20px; 
      text-align: center;
      border-bottom: 2px solid #ffe4e9;
      padding-bottom: 8px;
    }
    p { 
      line-height: 1.6; 
      font-size: 13px; 
      color: #444; 
    }
    
    /* Box Info Kontak (Hanya WhatsApp & Instagram, jadi 2 kolom seimbang) */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }
    .contact-item {
      background: #fff0f3;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ffccd5;
      text-align: center;
    }
    .contact-item h4 {
      color: #c94c62;
      margin: 0 0 8px 0;
      font-size: 14px;
    }
    .contact-item p {
      margin: 0;
      font-size: 12px;
      font-weight: bold;
    }

    /* Form Pertanyaan / Pesan Singkat */
    .form-box {
      margin-top: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #ffccd5;
    }
    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ffccd5;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
      background: white;
    }
    .btn-send {
      background: #c94c62;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
    }
    .btn-send:hover {
      background: #a3384c;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Hubungi SHES Strap 💕</h2>
    <p style="text-align: center;">Punya pertanyaan seputar kustomisasi warna, nama, atau pemesanan khusus? Hubungi kami melalui informasi di bawah ini!</p>

    <!-- Info Kontak Utama (WhatsApp & Instagram) -->
    <div class="contact-grid">
      <div class="contact-item">
        <h4>📱 	Email</h4>
        <p>shelavs.a@gmail.com</p>
      </div>
      <div class="contact-item">
        <h4>📸 Instagram</h4>
        <p>@shes_strap</p>
      </div>
    </div>

    <!-- Form Kirim Pesan / Tanya-Tanya -->
    <div class="form-box">
      <h3 style="color: #c94c62; font-size: 14px; margin-top: 0; text-align: center;">Kirim Pesan / Pertanyaan</h3>
      <form onsubmit="alert('Terima kasih! Pesan kamu sudah terkirim ke SHES Strap.'); return false;">
        <div class="form-group">
          <label>Nama kamu:</label>
          <input type="text" placeholder="Masukkan nama..." required>
        </div>
        <div class="form-group">
          <label>Pesan / Pertanyaan:</label>
          <textarea rows="3" placeholder="Tulis pesan atau request warna di sini..." required></textarea>
        </div>
        <button type="submit" class="btn-send">Kirim Pesan 💌</button>
      </form>
    </div>
  </div>

</body>
</html>
